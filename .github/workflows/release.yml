name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # npm does the publish itself: trusted publishing (OIDC) needs npm >= 11.5.1, newer than Node 22 ships
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Checksum
        run: sha256sum dist/md.js > dist/md.sha256

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/md.js
            dist/md.sha256

      # Authenticates via the trusted publisher configured on npmjs.com, no token secret
      - name: Publish to npm
        run: npm publish --provenance --access public
